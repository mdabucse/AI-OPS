[project]
name = "aiops-capstone"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2"
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
