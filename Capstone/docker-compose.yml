services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - capstone_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://aiops:aiops@db:5432/aiops
      DEMO_USERNAME: admin
      DEMO_PASSWORD: admin
      SECRET_KEY: capstone-local-secret
      ALERT_CHANNEL: ${ALERT_CHANNEL:-teams}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  capstone_postgres_data:
