[project]
name = "lab-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Abubakkar", email = "mabubakkars@presidio.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib==1.6.0",
    "jupyterlab==4.6.4",
    "matplotlib==3.11.2",
    "mlflow==3.17.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
]

[project.scripts]
lab-env = "lab_env:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
